name: qwq-my

services:
  web:
    image: qwq-my-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        format: raw
    environment:
      MONGODB_URI: mongodb://qwq_my:qwq_my_password@mongo:27017/qwq_my?authSource=admin
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: qwq_my
      MONGO_INITDB_ROOT_PASSWORD: qwq_my_password
      MONGO_INITDB_DATABASE: qwq_my
    volumes:
      - ./docker/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0-alpine
    volumes:
      - ./docker/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
